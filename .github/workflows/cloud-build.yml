name: Verify Wan containers
run-name: Verify ${{ inputs.target }} container · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Container to verify (no GPU or model downloads)
        required: true
        type: choice
        default: cpu
        options:
          - cpu
          - gpu

permissions:
  contents: read

concurrency:
  group: wan-container-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BUILD_TARGET: ${{ inputs.target }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify runner capacity
        run: python3 deployment/cloud_build.py preflight --target "$BUILD_TARGET" --output "$RUNNER_TEMP/wan-cloud"
      - name: Build and run offline container checks
        run: |
          timeout --signal=TERM --kill-after=30s 30m \
            python3 deployment/build_verify.py --target "$BUILD_TARGET" \
              --output "$RUNNER_TEMP/wan-cloud/build" --execute
      - name: Preserve bounded evidence
        if: always()
        env:
          VERIFICATION_OUTCOME: ${{ job.status }}
        run: python3 deployment/cloud_build.py archive --target "$BUILD_TARGET" --output "$RUNNER_TEMP/wan-cloud"
      - name: Upload verification evidence for one day
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wan-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wan-cloud-evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
