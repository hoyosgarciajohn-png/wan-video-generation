name: LongCat full queue fictional checks
on:
  pull_request:
    paths:
      - 'workers/gpu/longcat_*.py'
      - 'workers/gpu/tests/test_longcat_batch.py'
      - 'workers/gpu/longcat.Dockerfile'
      - 'workers/gpu/longcat.Dockerfile.dockerignore'
      - 'services/controller/longcat.py'
      - 'services/controller/http_api.py'
      - 'deployment/hosted_app.py'
      - 'deployment/longcat_*.py'
      - 'tests/test_longcat*.py'
      - 'contracts/runtime-policy.json'
      - 'workers/media/test_export.py'
      - 'workers/media/longcat_assemble.py'
      - '.github/workflows/longcat-full-queue-checks.yml'
permissions:
  contents: read
jobs:
  fictional:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Install CPU check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install -r requirements-dev.txt Pillow==11.3.0
          ffmpeg -version >/dev/null
          npm ci --ignore-scripts --no-audit --no-fund --prefix apps/studio
      - name: Contract, controller, queue and full-duration export checks
        run: |
          python3 -m compileall -q deployment services workers
          python3 scripts/validate_contract.py --media-root fixtures
          python3 -m unittest discover -s tests -v
          python3 -m unittest workers.gpu.tests.test_longcat_batch workers.media.test_export -v
      - name: Studio shared policy checks
        working-directory: apps/studio
        env:
          WAN_PYTHON: python3
        run: npm test
  runtime-import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Verify disposable build capacity
        run: python3 deployment/cloud_build.py preflight --target gpu --output "$RUNNER_TEMP/longcat-production"
      - name: Build and import the production adapter without GPU allocation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/longcat-production-auth"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f workers/gpu/longcat.Dockerfile -t longcat-production-check .
          docker image inspect longcat-production-check --format '{{.Id}}' > "$RUNNER_TEMP/longcat-production/image-id.txt"
          docker run --rm --network none --entrypoint python longcat-production-check -c 'from workers.gpu.longcat_bootstrap import main; from workers.gpu.longcat_client import LongCatClient; print("OFFLINE_PRODUCTION_IMPORT_PASS")'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: longcat-production-import-${{ github.run_id }}
          path: ${{ runner.temp }}/longcat-production
          retention-days: 3
          if-no-files-found: error
