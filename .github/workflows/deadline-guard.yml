name: Guard one Runpod deadline
on:
  workflow_dispatch:
    inputs:
      trial:
        description: Exact approved trial scope for readiness receipt
        type: choice
        options: [first, diagnostic, repair, validation, fallback, allocation, comparison, singing, singing-recovery]
        default: first
        required: true
      scope:
        description: Exact JSON array of owner ID and project ID
        required: true
        type: string
      batch:
        description: Admitted batch identifier (no automatic admission)
        required: true
        type: string
      deadline:
        description: Original absolute Unix deadline, within the approved scope runtime
        required: true
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.trial == 'singing' || inputs.trial == 'singing-recovery') && 250 || 52 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Watch the exact request and terminate at its deadline
        env:
          RUNPOD_CLEANUP_TOKEN: ${{ secrets.RUNPOD_CLEANUP_TOKEN }}
          WAN_HOST_SSH_KEY: ${{ secrets.WAN_HOST_SSH_KEY }}
          WAN_GUARD_SCOPE: ${{ inputs.scope }}
          WAN_GUARD_BATCH: ${{ inputs.batch }}
          WAN_GUARD_DEADLINE: ${{ inputs.deadline }}
          WAN_TRIAL: ${{ inputs.trial }}
        run: bash deployment/hosting/run-guard.sh
