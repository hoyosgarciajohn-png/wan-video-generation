name: Verify Runpod cleanup credential
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One authenticated GET without resource changes
        env:
          RUNPOD_CLEANUP_TOKEN: ${{ secrets.RUNPOD_CLEANUP_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m deployment.check_cleanup_credential
