name: Prepare final same-Pod completion handoff
on:
  push:
    branches: [main]
    paths: [deployment/completion_control.py, deployment/completion_install.sh, .github/workflows/longcat-completion-install.yml]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Prepare control without touching the running model
        env:
          WAN_HOST_SSH_KEY: ${{ secrets.WAN_HOST_SSH_KEY }}
        run: bash deployment/completion_install.sh
