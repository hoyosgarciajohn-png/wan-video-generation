name: Install WAN controller
run-name: WAN controller ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect access or install once on the approved fresh host
        type: choice
        options: [inspect, install, resume, upgrade, verify, diagnose, owner-access, recovery]
        default: inspect
        required: true
      host_fingerprint:
        description: Exact ed25519 SHA256 fingerprint from the inspected host (required for install/verify)
        type: string
        required: false
      access_public_key:
        description: Base64 RSA 3072 public PEM key for sealed existing owner-token delivery
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: wan-controller-install
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Inspect, install or verify exact approved host
        env:
          WAN_HOST_SSH_KEY: ${{ secrets.WAN_HOST_SSH_KEY }}
          RUNPOD_CLEANUP_TOKEN: ${{ inputs.operation == 'install' && secrets.RUNPOD_CLEANUP_TOKEN || '' }}
          WAN_HOST_OPERATION: ${{ inputs.operation }}
          WAN_HOST_FINGERPRINT: ${{ inputs.host_fingerprint }}
          WAN_ACCESS_PUBLIC_KEY: ${{ inputs.access_public_key }}
        run: bash deployment/hosting/cloud-install.sh
