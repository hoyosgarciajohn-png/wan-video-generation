name: Install WAN controller
run-name: WAN controller ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect access or install once on the approved fresh host
        type: choice
        options: [inspect, install, resume, upgrade, verify, diagnose, owner-access, recovery, recovery-copy, scale-rehearsal, trial-prepare, trial-admit, trial-launch, trial-observe, trial-export]
        default: inspect
        required: true
      trial:
        description: Exact approved trial scope (only for trial operations)
        type: choice
        options: [first, diagnostic, repair, validation, fallback, allocation, comparison]
        default: first
        required: true
      host_fingerprint:
        description: Exact ed25519 SHA256 fingerprint from the inspected host (required for install/verify)
        type: string
        required: false
      access_public_key:
        description: Base64 RSA 3072 public PEM key for sealed existing owner-token delivery
        type: string
        required: false
      gpu_quote:
        description: Fresh connected Runpod GPU quote JSON (trial prepare, admit, launch)
        type: string
        required: false
      billing_record:
        description: Connected Runpod billing JSON for the exact Pod (observe only)
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: wan-controller-install
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.operation == 'install' || inputs.operation == 'upgrade'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install media decoder for independent recovery
        if: inputs.operation == 'recovery' || inputs.operation == 'recovery-copy' || inputs.operation == 'trial-export'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Inspect, install or verify exact approved host
        env:
          GH_TOKEN: ${{ github.token }}
          WAN_HOST_SSH_KEY: ${{ secrets.WAN_HOST_SSH_KEY }}
          RUNPOD_CLEANUP_TOKEN: ${{ inputs.operation == 'install' && secrets.RUNPOD_CLEANUP_TOKEN || '' }}
          WAN_HOST_OPERATION: ${{ inputs.operation }}
          WAN_TRIAL: ${{ inputs.trial }}
          WAN_HOST_FINGERPRINT: ${{ inputs.host_fingerprint }}
          WAN_ACCESS_PUBLIC_KEY: ${{ inputs.access_public_key }}
          WAN_GPU_QUOTE: ${{ inputs.gpu_quote }}
          WAN_BILLING_RECORD: ${{ inputs.billing_record }}
        run: bash deployment/hosting/cloud-install.sh
      - name: Preserve retained comparison outputs
        if: inputs.operation == 'trial-export'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wan-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/wan-comparison
          if-no-files-found: error
          retention-days: 7
